# pgBackRest live config — mounted into unifiedcollector_postgres AND
# unifiedcollector_pgbackrest at /etc/pgbackrest.conf. See ./README.md and
# docs/plans/backup-modernization-pgbackrest.md.
#
# Phase 1: local repo on Z: drive only (no cloud). Phase 2 switches
# repo1-type / repo1-s3-* to Cloudflare R2 once creds are wired.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=2
repo1-retention-archive=7
repo1-retention-archive-type=diff

process-max=2
compress-type=zst
compress-level=3

delta=y
start-fast=y

archive-async=y
archive-push-queue-max=8GiB
spool-path=/var/spool/pgbackrest

protocol-timeout=1800
db-timeout=600

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
log-level-stderr=warn

[main]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-database=unifiedcollector
pg1-user=collector
