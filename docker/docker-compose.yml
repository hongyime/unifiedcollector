name: unifiedcollector

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unifiedcollector_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unifiedcollector
    ports:
      # Configurable host-side port. Default 5433 to avoid colliding with
      # any pre-existing local postgres on 5432 (e.g. another project's
      # docker postgres). Containers inside this compose network connect
      # via host=postgres:5432 — only the host-side mapping changes.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collector}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_collector
    command: python -m src.main worker --all
    # Idle safety-net / image-builder: all sources disabled, so it needs almost
    # nothing at rest. Cut 384m -> 128m (memory-pressure relief for rabbitmq).
    mem_limit: 128m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      # freeze fix: youtube AND tiktok run blocking subprocess downloaders
      # (yt-dlp / gallery-dl) that wedge on lost SIGCHLD in WSL2/Docker and freeze
      # the SHARED event loop (py-spy confirmed MainThread stuck in _run_subprocess).
      # Both are disabled here and run out-of-process in their own containers (P3-1).
      # The subprocess_downloader hard-timeout is the defense-in-depth backstop.
      # P3-1 FULL SPLIT: every source runs in its OWN dedicated container.
      # The main collector disables ALL sources and effectively idles --
      # it remains only as the canonical image builder + safety net.
      # Re-enable a source HERE only if you also remove its dedicated container.
      COLLECTOR_DISABLED_SOURCES: "youtube,tiktok,instagram,search,website,lemon8,telegram,github,strava,beeper,whatsapp"
      # Conn-budget hygiene (P2 review §5): this main worker idles (all sources
      # disabled), so it needs almost no DB connections. Shrink its pool from the
      # default 10 to free headroom under postgres max_connections=200 (14 pools ×
      # 10 = 140 ignores watchdog/backup/dashboard/ad-hoc scripts).
      DB_POOL_MAX_SIZE: "3"
      # Beeper Desktop Local API runs on the host at 127.0.0.1:23373.
      # The default URL inside .env (host.docker.internal:23373) resolves
      # via the extra_hosts entry below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # P3-1: youtube runs in its OWN process/container, isolated from the main
  # collector's shared event loop. yt-dlp invokes a blocking subprocess that can
  # wedge on lost SIGCHLD in WSL2/Docker (py-spy confirmed); in the shared worker
  # that froze all 11 collectors. Here a wedge only affects youtube, and
  # restart:unless-stopped + the subprocess_downloader hard-timeout recover it.
  # Re-enabled by NOT disabling it here (the main collector still disables it via
  # COLLECTOR_DISABLED_SOURCES=youtube).
  collector_youtube:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_youtube
    init: true  # reap yt-dlp/ffmpeg zombies so recreate can't wedge on a defunct PID
    command: python -m src.main worker --source youtube
    mem_limit: 1300m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      YOUTUBE_ENRICH_BATCH_LIMIT: "5"
      YOUTUBE_MAX_CONCURRENT_DOWNLOADS: "2"
      YOUTUBE_VIDEO_BACKFILL_BATCH_SIZE: "12"
      YOUTUBE_VIDEO_BACKFILL_MAX_PASSES: "2"
      YOUTUBE_VIDEO_BACKFILL_FAILED_RETRY_HOURS: "24"
      YOUTUBE_VIDEO_BACKFILL_SCAN_LIMIT: "10000"
      YOUTUBE_VIDEO_DOWNLOADS_PER_TARGET: "5"
      YOUTUBE_VIDEO_DOWNLOAD_TIMEOUT: "600"
      YOUTUBE_YTDLP_FORMAT: "best[height<=720][vcodec!=none][acodec!=none]/best[height<=480][vcodec!=none][acodec!=none]/best[height<=720]/best[height<=480]/worst"
      YOUTUBE_MAX_FILESIZE: "900M"
      YOUTUBE_DOWNLOAD_DELAY: "3.0"
      # Media-first policy: do not permanently exclude longer videos. Backfill
      # remains bounded by batch size, failed-retry delay, and yt-dlp timeout.
      YOUTUBE_MAX_VIDEO_DURATION_MINUTES: "0"
      YOUTUBE_COOKIE_FILE: /app/credentials/youtube/cookies.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # P3-1 (extended to tiktok): tiktok runs in its OWN process/container. Its
  # gallery-dl / yt-dlp fallbacks invoke blocking subprocesses that wedge on lost
  # SIGCHLD in WSL2/Docker (py-spy confirmed gallery_dl_download -> _run_subprocess
  # stuck in threading wait at 0% CPU); in the shared worker that froze ALL
  # collectors. Here a wedge only affects tiktok, and restart:unless-stopped + the
  # subprocess_downloader hard-timeout recover it. The subprocess fallbacks are
  # ENABLED here (overriding the .env defaults that keep them off for the shared
  # main collector). The main collector disables tiktok via COLLECTOR_DISABLED_SOURCES.
  collector_tiktok:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_tiktok
    init: true  # reap gallery-dl/yt-dlp zombies so recreate can't wedge on a defunct PID
    command: python -m src.main worker --source tiktok
    mem_limit: 1300m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      # Keep TikTok moving: each profile is chunked and cursored, so a bad page
      # should not occupy the isolated worker for a full 15 minutes.
      TIKTOK_TIMEOUT_SECONDS: "240"
      TIKTOK_PROFILE_CHUNK_ITEMS: "30"
      TIKTOK_GALLERY_DL_MAX_ITEMS: "30"
      TIKTOK_YTDLP_MAX_DOWNLOADS: "30"
      TIKTOK_YTDLP_AFTER_EMPTY_GALLERY: "false"
      # Subprocess download tiers enabled ONLY in this isolated container.
      TIKTOK_YTDLP_FALLBACK_ENABLED: "true"
      TIKTOK_GALLERY_DL_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # P3-1 FULL SPLIT: every source runs in its OWN process/container.
  # Same image (unifiedcollector-collector:latest), command
  #   python -m src.main worker --source <name>
  # Shared volumes/env; restart:unless-stopped + per-container mem_limit.
  # The main `collector` service disables ALL of these via
  # COLLECTOR_DISABLED_SOURCES so nothing is collected twice.
  # mem_limit values are tuned for a ~7.7GiB host (see total budget note).
  # ───────────────────────────────────────────────────────────────

  # Merged low-risk / low-volume sources (github + strava + search) in ONE
  # worker process. Each separate container carried a full Python-interpreter
  # RSS baseline (~100-150MB just to exist); merging three reclaims ~1.5GB vs
  # the old 1300+512+512. These three are low ban-risk and rarely wedge, so they
  # are the safe candidates to give up per-source container fault-isolation.
  collector_lowrisk:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_lowrisk
    init: true  # reap search/gallery-dl subprocess zombies (this wedged a recreate before)
    command: python -m src.main worker --source github,strava,search
    # 768m was too tight for the merged github+strava+search worker — github's
    # spider + ~42k seeded known-ids pushed it to ~93% and it got TERM'd ~every
    # 35min (graceful exit-0, not cgroup-OOM). Raised to give headroom.
    # EDIT 2026-07-13 (restart diagnosis): 1536m -> 2560m. RSS sat at ~1.25GiB
    # (83%) steady; known-id seeds are now github ~15k + strava ~11k + search
    # ~79k (search reconciler also holds per-row file_paths), and the github
    # collector reseeds on every watchdog relaunch. NOTE the historical ~35min
    # graceful TERM cadence matches the freshness watchdog (WATCHDOG_INTERVAL
    # 300s + 1800s restart cooldown) restarting a stale lowrisk via the docker
    # socket — NOT Docker OOM and NOT an in-process self-heal (those exit 42).
    # Docker never restarts on unhealthy by itself (no autoheal service). Sized
    # for the 7.76GiB WSL2 VM (~2GiB MemAvailable at edit time): +1GiB worst-
    # case growth leaves ~1GiB VM headroom. Do NOT raise to 3072m on this VM.
    mem_limit: 2560m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      # EDIT 2026-08-01 (DB pressure): page scrape 100 -> 20. The old low-risk
      # lane was saturating Postgres while realtime/media collectors were healthy.
      # Keep history moving, but cap per-cycle DB churn.
      STRAVA_PAGE_SCRAPE_BATCH: "20"
      SEARCH_SPIDER_PAGES: "1"
      # Strava athlete spider (kudos/comments/followers/clubs) — paced for I/O.
      STRAVA_SPIDER_ENABLED: "true"
      STRAVA_FOLLOW_SCRAPE_ENABLED: "true"
      # EDIT 2026-07-13: 15 -> 3. Each spider athlete = a full month-by-month
      # history backfill (~4-6min, ~200 activities discovered), so 15/cycle was
      # ~50min/cycle of NEW stream_status=NULL rows (add ~1.7k/day) starving the
      # GPS drain (~324/day) — the backlog GREW. Queue has ~25k pending athletes
      # (unbounded), so discovery loses nothing by going slower; raise back once
      # strava_activities.stream_status NULL count converges.
      STRAVA_SPIDER_MAX_PER_CYCLE: "3"
      # GPS-route backfill: bounded to protect DB/API pressure while Strava is
      # already returning stream 429s. Re-raise after stream cooldowns stabilize.
      STRAVA_GPS_BACKFILL_BATCH: "40"
      STRAVA_GPS_BACKFILL_FIRST: "true"
      STRAVA_ROUTE_STREAM_SHARED_COOLDOWN: "true"
      STRAVA_PROFILE_ENRICH_BATCH: "15"
      # GitHub graph expansion: no hard caps on high-signal repo history.
      # Keep weak repo fanout bounded; stargazers/watchers are weaker evidence
      # and can explode far faster than commits/issues/contributors.
      GITHUB_API_DELAY: "1.0"
      GITHUB_MAX_CONCURRENT: "1"
      GITHUB_TARGET_CONCURRENCY: "1"
      GITHUB_SPIDER_CONCURRENCY: "1"
      GITHUB_SPIDER_BATCH_SIZE: "25"
      GITHUB_MAX_COMMITS_PER_REPO: "0"
      GITHUB_MAX_ISSUES_PER_REPO: "0"
      GITHUB_MAX_CONTRIBUTORS_PER_REPO: "0"
      GITHUB_MAX_BRANCHES_PER_REPO: "0"
      GITHUB_MAX_WEAK_FANOUT_PER_REPO: "500"
      GITHUB_COLLECT_BRANCH_COMMITS: "true"
      # CPU hygiene (A#4): low-volume / API-ceiling sources idle longer between
      # cycles — fewer wakeups, lower steady-state CPU, zero data loss.
      GITHUB_API_TRANSPORT_RETRIES: "2"
      COLLECTOR_CYCLE_SLEEP_GITHUB: "900"
      COLLECTOR_CYCLE_SLEEP_STRAVA: "600"
      COLLECTOR_CYCLE_SLEEP_SEARCH: "600"
      # Conn-budget hygiene (P2 review §5): low-volume, long-cycle sources — a
      # small pool is plenty. Default 10 -> 4.
      DB_POOL_MAX_SIZE: "4"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Data-freshness watchdog: the container healthchecks on collector_telegram /
  # wa_bridge_* only test HTTP and stay green when the MTProto/WhatsApp connection
  # is dead. This checks the newest row per realtime source and restarts the owning
  # container(s) when a source goes stale (telegram once sat dead 26h, whatsapp 4d).
  # Reuses the collector image; needs the docker socket to issue restarts.
  watchdog:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_watchdog
    command: python -m src.watchdog.freshness
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      WATCHDOG_INTERVAL: "300"
      WATCHDOG_STALE_TELEGRAM: "3600"
      WATCHDOG_STALE_WHATSAPP: "14400"
      WATCHDOG_STALE_BEEPER: "10800"
    volumes:
      - ../src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
    # Load ../.env so the Telegram notifier (NOTIFY_TELEGRAM_BOT_TOKEN /
    # TELEGRAM_CHAT_ID) can alert on stale-source restarts. Without it the
    # notifier silently no-ops (send-only, fail-safe).
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    # The safety net now has its own safety net: a wedged loop (or dead
    # interpreter) fails this heartbeat check and restart:unless-stopped revives
    # it. start_period covers the first interval before a heartbeat exists.
    healthcheck:
      test: ["CMD", "python", "-m", "src.watchdog.freshness", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 360s

  collector_website:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_website
    init: true  # reap subprocess zombies so recreate can't wedge
    command: python -m src.main worker --source website
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      WEBSITE_TARGET_TIMEOUT_SECONDS: "45"
      WEBSITE_TARGET_RETRY_BACKOFF_SECONDS: "21600"
      WEBSITE_TARGET_RETRY_BACKOFF_MAX_SECONDS: "604800"
      # Concurrency drives REAL RSS (each task holds a page + parse tree). After
      # the host OOM, dialled 10 -> 6 to lower website's memory peak — a real RSS
      # cut (unlike a mem_limit cap), minor throughput cost across 421 sites.
      WEBSITE_MAX_CONCURRENT_TASKS: "10"
      # CPU hygiene (A#4): website crawls are multi-hour; idle longer between cycles.
      COLLECTOR_CYCLE_SLEEP_WEBSITE: "600"
      # Conn-budget hygiene (P2 review §5): default 10 -> 6. Kept above lowrisk/main
      # because up to WEBSITE_MAX_CONCURRENT_TASKS pages may write concurrently.
      DB_POOL_MAX_SIZE: "6"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_lemon8:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_lemon8
    init: true  # reap subprocess zombies so recreate can't wedge
    command: python -m src.main worker --source lemon8
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      LEMON8_FYP_DETAIL_FETCH: "true"
      LEMON8_TARGETS_PER_CYCLE: "6"
      LEMON8_SPIDER_QUEUE_PER_CYCLE: "8"
      LEMON8_FEED_PAGES_PER_CYCLE: "2"
      LEMON8_FEED_MEDIA_PER_CYCLE: "40"
      LEMON8_FYP_DETAIL_PER_CYCLE: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_telegram:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_telegram
    init: true  # reap subprocess zombies so recreate can't wedge
    command: python -m src.main worker --source telegram
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      # collect() now BLOCKS in the realtime listener (like whatsapp), so the
      # per-cycle heartbeat stops — give the watchdog a 24h budget so it doesn't
      # kill the parked-but-healthy listener (matches whatsapp's setting).
      COLLECTOR_HANG_TIMEOUT_SECONDS: "86400"
      # Restart quickly for true MTProto ignore-storms or session DB locks.
      # Recoverable Telethon "wrong session ID" reconnect warnings are ignored.
      COLLECTOR_SELFHEAL_LOG_WINDOW: "300"
      COLLECTOR_SELFHEAL_LOG_THRESHOLD: "10"
      # Startup should prioritize realtime/media. Dialog discovery is still
      # available for hot-added accounts, but the startup heuristic can misread
      # old accounts as new and churn Telegram sessions.
      TELEGRAM_AUTO_BACKFILL_NEW_ACCOUNTS: "false"
      # Only these lower-risk accounts may process spider/join work. Other
      # Telegram accounts still collect existing dialogs and realtime messages.
      TELEGRAM_SPIDER_ACCOUNTS: "oopspwned,johnfriend101"
      # Discussion groups: 0 means read all available history, not just the old
      # 2,000-message recent window. Member collection is already full-list when
      # Telegram allows participant enumeration.
      TELEGRAM_DISCUSSION_MESSAGE_LIMIT: "0"
      # Per-message identity enumeration caps for public reactions/polls.
      TELEGRAM_REACTION_USER_CAP: "500"
      TELEGRAM_POLL_VOTE_USER_CAP: "500"
      TELEGRAM_ADMIN_LOG_ENABLED: "true"
      TELEGRAM_ADMIN_LOG_LIMIT: "1000"
      TELEGRAM_JOIN_LINKS_MAX_PER_CYCLE: "10"
      TELEGRAM_JOIN_LINK_TIMEOUT: "120"
      TELEGRAM_JOIN_MESSAGE_LIMIT: "0"
      TELEGRAM_MENTION_BACKFILL_BATCH: "2000"
      TELEGRAM_MENTION_BACKFILL_INTERVAL: "60"
      # More aggressive but below the old 250/30s/200 setting that saturated the
      # Z media drive. Live capture is unaffected by these backfill knobs.
      TELEGRAM_BACKFILL_MSG_PER_SEC: "120"
      TELEGRAM_BACKFILL_DRAIN_INTERVAL: "90"
      TELEGRAM_SPIDER_MAX_PER_CYCLE: "75"
      # Get ALL historical chats: raise the enqueue cap so every dialog across all
      # 4 accounts is queued (user: "ensure we get ALL historical chats").
      TELEGRAM_SPIDER_QUEUE_MAX: "20000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      # live src mount: lets collector code fixes apply on a plain recreate (no
      # image rebuild -> vhdx doesn't grow). Same pattern as ig_ingest.
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_beeper:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_beeper
    init: true  # reap subprocess zombies so recreate can't wedge
    command: python -m src.main worker --source beeper
    mem_limit: 768m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      BEEPER_DESKTOP_API_URL: http://host.docker.internal:23373
      # Larger pages = fewer Beeper Desktop Local API round-trips per sync.
      BEEPER_PAGE_SIZE: "150"
      # Stability (2026-06-21, Bryan reported recurring "beeper disconnected"):
      # the Beeper Desktop Local API (host:23373) is intermittently unresponsive,
      # so a single blip used to end the cycle -> error -> retry -> alert. Ride
      # the blips with more transient retries + gentler backoff, and stop the
      # watchdog false-killing productive-but-slow cycles (progress_count only
      # ticks on a successful media insert, so failed-media cycles look "hung").
      BEEPER_TRANSIENT_RETRIES: "6"
      BEEPER_TRANSIENT_BACKOFF: "2.0"
      COLLECTOR_HANG_TIMEOUT_SECONDS: "5400"
      # Wider room coverage + bounded history per cycle. Keep cycles completing
      # frequently so live message freshness wins over historical drain.
      BEEPER_MAX_CHATS_PER_CYCLE: "75"
      BEEPER_BACKFILL_PAGES_PER_CYCLE: "4"
      BEEPER_BACKFILL_CANDIDATE_MESSAGES: "1000"
      BEEPER_BACKFILL_QUERY_TIMEOUT: "30"
      BEEPER_MESSAGES_FIRST: "true"
      BEEPER_ACCOUNTS_TIMEOUT: "20"
      BEEPER_CHATS_TIMEOUT: "90"
      BEEPER_MESSAGES_TIMEOUT: "600"
      BEEPER_CHAT_SYNC_TIMEOUT_SECONDS: "45"
      BEEPER_OPTIONAL_PHASE_TIMEOUT_COOLDOWN_SECONDS: "900"
      # Keep live message sync ahead of historical network cleanup. The repair
      # runs after message sync and is intentionally bounded so a DB-heavy pass
      # cannot make Beeper look stale.
      BEEPER_NETWORK_REPAIR_LIMIT: "2000"
      BEEPER_NETWORK_REPAIR_TIMEOUT: "20"
      # One-shot, bounded probe of old failed Beeper assets after cache/session
      # changes. Bump the marker to retry another tiny sample; same marker is
      # remembered in service_cursors and will not run every cycle.
      BEEPER_TOMBSTONE_RETRY_MARKER: "2026-07-29-initial-cache-probe"
      BEEPER_TOMBSTONE_RETRY_LIMIT: "5"
      BEEPER_TOMBSTONE_RETRY_MIN_AGE_DAYS: "7"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_whatsapp:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_whatsapp
    init: true  # reap subprocess zombies so recreate can't wedge
    command: python -m src.main worker --source whatsapp
    mem_limit: 768m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      WHATSAPP_SPIDER_SESSIONS: "session_2"
      # Backfill ALL history, not just 90 days (user: "whatsapp backfill all").
      WHATSAPP_MAX_BACKFILL_AGE_DAYS: "36500"
      # Throughput push (2026-07-29): 24 req/min with 100-message batches.
      # Monitor session-risk/history progress; tune down if WhatsApp throttles.
      WHATSAPP_BACKFILL_REQ_PER_MIN: "24"
      WHATSAPP_BACKFILL_BATCH_SIZE: "100"
      WHATSAPP_MEDIA_ARCHIVAL_BATCH_SIZE: "100"
      # WhatsApp is event-driven: collector.run() blocks in the RabbitMQ
      # consumer loop until messages arrive. The default 1800s watchdog kills
      # it during quiet periods (e.g. overnight). 86400s = 24h gives it room
      # to wait; Docker restart:unless-stopped recovers genuine OOM/crash.
      COLLECTOR_HANG_TIMEOUT_SECONDS: "86400"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_instagram:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_instagram
    init: true  # reap subprocess zombies so recreate can't wedge
    command: python -m src.main worker --source instagram
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      # ANTI-BAN (user: "make sure headless cookies don't get my account banned").
      # Headless Playwright is more detectable than a real browser, so run it as a
      # GENTLE periodic backup: lower daily profile-view quota, fully-serial spider,
      # and a long idle between cycles. The extension is the primary live path.
      INSTA_DAILY_QUOTA_PROFILE_VIEWS: "60"
      INSTA_SKIP_HEADLESS_WHEN_EXTENSION_FRESH: "true"
      INSTA_EXTENSION_FRESH_SKIP_SECONDS: "7200"
      INSTA_HTTPX_PROFILE_FALLBACK: "false"
      INSTA_SPIDER_CONCURRENCY: "1"
      INSTA_SPIDER_HOPS: "1"
      INSTA_PLAYWRIGHT_POSTS_ZERO_THRESHOLD: "3"
      INSTA_PLAYWRIGHT_POSTS_ZERO_COOLDOWN_SECONDS: "3600"
      # ANTI-BAN (P2 review §4): the flagged IG account shares ONE cookie jar with
      # ig_ingest. Behavioural flags come from NOVEL profile-view/discovery patterns,
      # not from re-fetching known content. Disable follower-graph BFS discovery in
      # the HEADLESS path so it only refreshes already-known entities; the browser
      # extension remains the sole IG discovery path (it uses its own IG_SPIDER_MAX_HOP,
      # unaffected by this flag — read only at instagram/__init__.py:1071).
      INSTA_SPIDER_FOLLOWERS: "false"
      COLLECTOR_CYCLE_SLEEP_INSTAGRAM: "1800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ⚠️ BAN-RISK COLLECTOR — DO NOT ENABLE WITHOUT READING THE ACTIVATION RUNBOOK ⚠️
  # docs/handoff/INSTAGRAM_DM_ACTIVATION.md explains the 3-step activation
  # (implement code / set flag+creds / start container) and the isolation
  # invariants this service preserves.
  #
  # This service is gated behind the Docker Compose "instagram-dm" profile so
  # `docker compose up` without `--profile instagram-dm` NEVER starts it. That
  # matches how the code inside `src/collectors/instagram_dm/` refuses to
  # touch the network unless INSTAGRAM_DM_COLLECTOR_ENABLED=true.
  #
  # Ban isolation vs the main `collector_instagram` service:
  #   * own container name (a ban → this container dies, main IG stays green)
  #   * own credentials/instagram_dm/ mount (never touches credentials/instagram/)
  #   * own INSTAGRAM_DM_PROXY_URL env (does NOT inherit PROXY_URL)
  #   * own INGEST_PATH='mobile_api' on rows it writes (analyzer can filter)
  collector_instagram_dm:
    profiles: ["instagram-dm"]      # opt-in only; default `up` skips this service
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_instagram_dm
    init: true
    command: python -m src.main worker --source instagram_dm
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      # Feature flag — MUST be set to a truthy value ("1", "true", "yes", "on")
      # for any mobile-API network activity. Default off; the collector's
      # collect() no-ops with a single log line when the flag is missing.
      INSTAGRAM_DM_COLLECTOR_ENABLED: "false"
      # Isolated credentials dir — the code guards against this pointing at
      # credentials/instagram/ (see src/collectors/instagram_dm/__init__.py::collect).
      INSTAGRAM_DM_CREDENTIALS_DIR: "credentials/instagram_dm"
      # Separate egress. Leave unset if not using a proxy; do NOT set to
      # PROXY_URL (which would share exit IP with the main IG collector).
      INSTAGRAM_DM_PROXY_URL: ""
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      # Only mount the isolated credentials subdir — the main credentials/
      # tree is intentionally NOT bind-mounted here so a code bug cannot
      # accidentally read credentials/instagram/*.txt.
      - ../credentials/instagram_dm:/app/credentials/instagram_dm
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Instagram ingest bridge for the Chrome extension. Runs as a reliable
  # auto-restart container (vs a fragile manual host process) and publishes 8765
  # so the extension's service worker can reach it at 127.0.0.1:8765. The live
  # Runs from the baked image copy of /app/src. This bridge is latency-critical
  # for the Chrome extension; running it from Docker Desktop's Windows 9p bind
  # mount can wedge Python import/startup in p9_client_rpc and leave port 8765
  # accepting sockets without responses. Rebuild the collector image before
  # recreating this service when ig_ingest code changes.
  ig_ingest:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_ig_ingest
    command: python -m src.bridges.ig_ingest
    mem_limit: 512m
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      # skip accounts > 3k followers when spider-discovering (user: close network only)
      INSTA_SPIDER_FAMOUS_CAP: "3000"
      STRAVA_ROUTE_STREAM_SHARED_COOLDOWN: "true"
      STRAVA_BROWSER_ROUTE_QUEUE_CANDIDATE_LIMIT: "50"
      STRAVA_BROWSER_ROUTE_QUEUE_IMPORTANT_CANDIDATE_LIMIT: "100"
      TIKTOK_FOLLOW_OWNER_FALLBACK: ${TIKTOK_FOLLOW_OWNER_FALLBACK:-hongyime}
      SOCIAL_INGEST_PREP_DB_ON_STARTUP: "true"
      BROWSER_CONTENT_HINT_RESPONSE_TIMEOUT_SECONDS: "2.0"
      UC_EXTENSION_EXPECTED_VERSION: "1.23.43"
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials   # so /social/cookies can write live sessions
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_scheduler
    command: python -m src.main scheduler
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      # Conn-budget hygiene (P2 review §5): scheduler triggers + reconciliation are
      # low-concurrency. Default 10 -> 4.
      DB_POOL_MAX_SIZE: "4"
      # Operator status compares live Chrome hook heartbeats against this repo
      # extension build. Update with extension/manifest.json version bumps.
      UC_EXTENSION_EXPECTED_VERSION: "1.23.43"
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      # live src mount so scheduler code (e.g. identity reconciliation) applies on
      # a plain recreate — no image rebuild (vhdx must not grow). Matches the
      # collector/ig_ingest pattern; scheduler previously ran only baked-in code.
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  onboard_bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_onboard_bot
    command: python -m src.bots.onboard_bot
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Real-time post feed drain. Reads uc:realtime_post_feed off Redis (produced by
  # every successful media_items insert across the collectors) and posts a
  # small per-post Telegram message via send_photo / send_video. Rate-limited
  # (REALTIME_POST_FEED_MAX_PER_MINUTE, default 6) with a token bucket in
  # Redis + a rolling sha256 dedupe so a re-scraped post never posts twice.
  # A 15-min "skipped N burst" summary is emitted when the cap kicks in.
  realtime_feed:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_realtime_feed
    init: true
    command: python -m src.notifications.realtime_feed
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevredis123}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-localdevredis123}@redis:6379/0"
      # 1 = on, 0 = off. Default on so a fresh deploy posts realtime by default.
      REALTIME_POST_FEED_ENABLED: "${REALTIME_POST_FEED_ENABLED:-1}"
      REALTIME_POST_FEED_MAX_PER_MINUTE: "${REALTIME_POST_FEED_MAX_PER_MINUTE:-6}"
      REALTIME_POST_FEED_DEDUPE_TTL_DAYS: "${REALTIME_POST_FEED_DEDUPE_TTL_DAYS:-7}"
      REALTIME_POST_FEED_INCLUDE_PROFILES: "${REALTIME_POST_FEED_INCLUDE_PROFILES:-0}"
      REALTIME_POST_FEED_BURST_SUMMARY: "${REALTIME_POST_FEED_BURST_SUMMARY:-1}"
      REALTIME_POST_FEED_BURST_SUMMARY_SECONDS: "${REALTIME_POST_FEED_BURST_SUMMARY_SECONDS:-900}"
      LOG_LEVEL: info
    volumes:
      # The vault mount lets the drain read local media files instead of
      # relying on Telegram to fetch a URL (which fails for auth-gated media).
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      # Lightweight import check — the drain has no HTTP port. Failure here
      # means the module doesn't even import (i.e. code broke).
      test: ["CMD", "python", "-c", "import src.notifications.realtime_feed; import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: unifiedcollector_dashboard
    ports:
      # Keep the original local dashboard URL alive while 8700 remains the
      # canonical service port.
      - "8001:8700"
      - "8700:8700"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_VAULT_ROOT: /vault
      UC_EXTENSION_EXPECTED_VERSION: "1.23.43"
      YOUTUBE_MAX_VIDEO_DURATION_MINUTES: "0"
      STRAVA_ROUTE_STREAM_SHARED_COOLDOWN: "true"
      STRAVA_BROWSER_ROUTE_QUEUE_CANDIDATE_LIMIT: "50"
      STRAVA_BROWSER_ROUTE_QUEUE_IMPORTANT_CANDIDATE_LIMIT: "100"
      # Localhost-only single-user deployment: skip bearer-token auth so the
      # dashboard works without a login flow. Remove/false for network exposure.
      DASHBOARD_AUTH_DISABLED: "true"
    volumes:
      - z:/unifiedcollector/media:/media
      - z:/unifiedcollector:/vault
      - ../credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    image: unifiedcollector-backup:latest
    container_name: unifiedcollector_backup
    # Daily pg_dump -> Z:\unifiedcollector\backups\db with bounded retention:
    # 7 daily, 4 weekly, 3 monthly. Restore: pg_restore -d <db> <file>.dump
    # NOTE (2026-07-03): backups intentionally STAY on Z (user decision). The
    # co-location risk (a Z event kills media AND backups together) is accepted;
    # C: is space-crisis-prone and Z has 3.3TB free. The hardening below makes the
    # WRITES safe even though the location is shared:
    #   * dump to a temp name, then verify it is (a) non-empty AND (b) a valid,
    #     readable archive via `pg_restore --list` BEFORE atomically renaming to
    #     the final name. A reader/prune never sees a half-written or corrupt dump.
    #   * prune ONLY runs after a verified-good dump exists — so N days of failures
    #     can never delete the last good backup (the old code pruned unconditionally).
    #   * on failure: keep old backups, remove the temp, and fire a Telegram alert
    #     (previously `[backup] FAILED` went only to stdout that nobody reads).
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGDATABASE: unifiedcollector
      DATABASE_URL: ""
      COLLECTOR_DB_BACKUP_DIR: /zbackups
      COLLECTOR_DB_BACKUP_DAILY: "7"
      COLLECTOR_DB_BACKUP_WEEKLY: "4"
      COLLECTOR_DB_BACKUP_MONTHLY: "3"
      COLLECTOR_DB_BACKUP_INTERVAL_SECONDS: ${COLLECTOR_DB_BACKUP_INTERVAL_SECONDS:-86400}
      COLLECTOR_DB_BACKUP_RETRY_SECONDS: ${COLLECTOR_DB_BACKUP_RETRY_SECONDS:-3600}
      COLLECTOR_DB_BACKUP_TIMEOUT_SECONDS: ${COLLECTOR_DB_BACKUP_TIMEOUT_SECONDS:-7200}
      COLLECTOR_DB_BACKUP_STALL_TIMEOUT_SECONDS: ${COLLECTOR_DB_BACKUP_STALL_TIMEOUT_SECONDS:-300}
      COLLECTOR_DB_BACKUP_VALIDATE_TIMEOUT_SECONDS: ${COLLECTOR_DB_BACKUP_VALIDATE_TIMEOUT_SECONDS:-600}
      COLLECTOR_DB_BACKUP_DATABASE: unifiedcollector
      COLLECTOR_DB_BACKUP_VAULT_ROOT: /vault
      COLLECTOR_DB_BACKUP_REQUIRE_VAULT_MIRROR: "1"
    # Load ../.env for NOTIFY_TELEGRAM_BOT_TOKEN / TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
    # so the Python backup runner can send a best-effort failure alert.
    env_file:
      - ../.env
    volumes:
      - z:/unifiedcollector/backups/db:/zbackups
      - z:/unifiedcollector:/vault
      - ../src/backup:/app/src/backup:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          if python3 -m src.backup.db_backup run; then
            sleep "$${COLLECTOR_DB_BACKUP_INTERVAL_SECONDS:-86400}"
          else
            sleep "$${COLLECTOR_DB_BACKUP_RETRY_SECONDS:-3600}"
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    # `always` (not `unless-stopped`): after a SIGKILL (exit 137, OOM) the Docker
    # daemon sometimes records the last state as "stopped" rather than "exited",
    # which `unless-stopped` treats as "operator intent — don't restart". That
    # left the backup container dead until manually restarted (2026-08 incident).
    # `always` restarts regardless of prior state; safe here because backups are
    # long-idle sleeps between short bursts, so restart churn cannot compound.
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: unifiedcollector_rabbitmq
    hostname: rabbitmq
    init: true
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wac_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-localdevrabbit123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    # AMQP (5672) stays internal-only on the docker network.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-unifiedcollector.conf:ro
    healthcheck:
      # `rabbitmq-diagnostics ping` can hang under WSL2/Docker host load and
      # burn CPU while collection is otherwise flowing. For this local broker,
      # the actionable signal is whether AMQP accepts connections.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: unifiedcollector_redis
    init: true
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-localdevredis123} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdevredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-bridge-1:
    build:
      context: ../src/bridges/whatsapp
    container_name: unifiedcollector_wa_bridge_1
    init: true
    restart: unless-stopped
    environment:
      SESSION_NAME: session_1
      AUTH_STORAGE_PATH: /app/auth_info/account1
      WHATSAPP_RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      SYNC_FULL_HISTORY: "true"
      # On-demand deep history: actively pull older messages per chat (was stuck
      # ~9 days). Paced; 36500d = effectively all the phone still holds.
      WHATSAPP_DEEP_BACKFILL: "true"
      WHATSAPP_BACKFILL_REQ_PER_MIN: "24"
      WHATSAPP_FETCH_COUNT: "100"
      WHATSAPP_MAX_BACKFILL_AGE_DAYS: "36500"
      WHATSAPP_UNPAIRED_QR_RECONNECT_MS: "5000"
      WHATSAPP_QR_STABILITY_MS: "45000"
      WHATSAPP_MEDIA_BRIDGE_SECRET: ${WHATSAPP_MEDIA_BRIDGE_SECRET:-localdevmediabridgesecretkey12345678}
      LOG_LEVEL: info
    ports:
      - "3011:3001"
    volumes:
      - ../sessions/whatsapp:/app/auth_info
      # live-mount compiled build/ so code changes apply on recreate (no image
      # rebuild — vhdx must not grow).
      - ../src/bridges/whatsapp/build:/app/build
      - z:/unifiedcollector/media:/data/media
    depends_on:
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/livez"]
      interval: 10s
      timeout: 5s
      retries: 3

  wa-bridge-2:
    build:
      context: ../src/bridges/whatsapp
    container_name: unifiedcollector_wa_bridge_2
    init: true
    restart: unless-stopped
    environment:
      SESSION_NAME: session_2
      AUTH_STORAGE_PATH: /app/auth_info/account2
      WHATSAPP_RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      SYNC_FULL_HISTORY: "true"
      # On-demand deep history (see wa-bridge-1).
      WHATSAPP_DEEP_BACKFILL: "true"
      WHATSAPP_BACKFILL_REQ_PER_MIN: "24"
      WHATSAPP_FETCH_COUNT: "100"
      WHATSAPP_MAX_BACKFILL_AGE_DAYS: "36500"
      WHATSAPP_UNPAIRED_QR_RECONNECT_MS: "5000"
      WHATSAPP_QR_STABILITY_MS: "45000"
      WHATSAPP_MEDIA_BRIDGE_SECRET: ${WHATSAPP_MEDIA_BRIDGE_SECRET:-localdevmediabridgesecretkey12345678}
      LOG_LEVEL: info
    ports:
      - "3012:3001"
    volumes:
      - ../sessions/whatsapp:/app/auth_info
      - ../src/bridges/whatsapp/build:/app/build
      - z:/unifiedcollector/media:/data/media
    depends_on:
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/livez"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Chrome cookie vault: keeps a rolling on-disk backup of the social-platform
  # cookie jar via CDP (host-side Chrome on :9222). Historically, Chrome
  # restarts / profile-SQLite rewrites have silently killed sessionid /
  # c_user / auth_token cookies and stranded whole collectors until a human
  # noticed. This service snapshots every 5 min so a restore is one command,
  # and Chrome control stays permanently hands-off. Read-only relative to
  # source platforms — see `src/tools/browser_cookie_vault.py`.
  browser_cookie_vault:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_browser_cookie_vault
    command: python -m src.tools.browser_cookie_vault
    mem_limit: 128m
    ports:
      - "8790:8790"
    environment:
      # host.docker.internal maps to the Windows host via extra_hosts below;
      # Chrome's DNS-rebinding guard is worked around inside the daemon by
      # forcing the Host header to "localhost:9222" on the HTTP call.
      CHROME_CDP_URL: "http://host.docker.internal:9222"
      BROWSER_COOKIE_VAULT_DIR: "/app/credentials/browser_cookies"
      BROWSER_COOKIE_VAULT_INTERVAL_SECONDS: "300"
      BROWSER_COOKIE_VAULT_KEEP_SNAPSHOTS: "10"
      BROWSER_COOKIE_VAULT_HEALTH_PORT: "8790"
      # Auto-restore-on-startup stays OFF by default so a stale snapshot
      # cannot silently clobber a working live session. Toggle to "1" only
      # right after a confirmed Chrome cookie-loss event.
      BROWSER_COOKIE_VAULT_AUTORESTORE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/app/src
      - ../credentials/browser_cookies:/app/credentials/browser_cookies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  sessions_data:
