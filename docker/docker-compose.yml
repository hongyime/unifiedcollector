name: unifiedcollector

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unifiedcollector_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unifiedcollector
    ports:
      # Configurable host-side port. Default 5433 to avoid colliding with
      # any pre-existing local postgres on 5432 (e.g. another project's
      # docker postgres). Containers inside this compose network connect
      # via host=postgres:5432 — only the host-side mapping changes.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collector}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_collector
    command: python -m src.main worker --all
    mem_limit: 384m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      # freeze fix: youtube AND tiktok run blocking subprocess downloaders
      # (yt-dlp / gallery-dl) that wedge on lost SIGCHLD in WSL2/Docker and freeze
      # the SHARED event loop (py-spy confirmed MainThread stuck in _run_subprocess).
      # Both are disabled here and run out-of-process in their own containers (P3-1).
      # The subprocess_downloader hard-timeout is the defense-in-depth backstop.
      # instagram TEMPORARILY disabled 2026-05-31: the host IP is 429-blocked by
      # Instagram (all accounts, INSTA_PROXY_DISABLED=true). Per decision: wait the
      # block out with ZERO requests (fastest IP recovery, no proxy cost). Re-enable
      # by removing 'instagram' here after ~24-48h, then `docker compose up -d collector`.
      # P3-1 FULL SPLIT: every source now runs in its OWN dedicated container
      # (collector_search, _website, _lemon8, _telegram, _github, _strava,
      # _beeper, _whatsapp, plus the pre-existing _youtube, _tiktok). instagram
      # stays off (host IP 429-blocked). So the main collector disables ALL
      # sources and effectively idles -- it remains only as the canonical image
      # builder + a safety net. Re-enable a source HERE only if you also remove
      # its dedicated container above.
      COLLECTOR_DISABLED_SOURCES: "youtube,tiktok,instagram,search,website,lemon8,telegram,github,strava,beeper,whatsapp"
      # Beeper Desktop Local API runs on the host at 127.0.0.1:23373.
      # The default URL inside .env (host.docker.internal:23373) resolves
      # via the extra_hosts entry below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # P3-1: youtube runs in its OWN process/container, isolated from the main
  # collector's shared event loop. yt-dlp invokes a blocking subprocess that can
  # wedge on lost SIGCHLD in WSL2/Docker (py-spy confirmed); in the shared worker
  # that froze all 11 collectors. Here a wedge only affects youtube, and
  # restart:unless-stopped + the subprocess_downloader hard-timeout recover it.
  # Re-enabled by NOT disabling it here (the main collector still disables it via
  # COLLECTOR_DISABLED_SOURCES=youtube).
  collector_youtube:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_youtube
    command: python -m src.main worker --source youtube
    mem_limit: 1300m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      YOUTUBE_ENRICH_BATCH_LIMIT: "5"
      YOUTUBE_COOKIE_FILE: /app/credentials/youtube/cookies.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # P3-1 (extended to tiktok): tiktok runs in its OWN process/container. Its
  # gallery-dl / yt-dlp fallbacks invoke blocking subprocesses that wedge on lost
  # SIGCHLD in WSL2/Docker (py-spy confirmed gallery_dl_download -> _run_subprocess
  # stuck in threading wait at 0% CPU); in the shared worker that froze ALL
  # collectors. Here a wedge only affects tiktok, and restart:unless-stopped + the
  # subprocess_downloader hard-timeout recover it. The subprocess fallbacks are
  # ENABLED here (overriding the .env defaults that keep them off for the shared
  # main collector). The main collector disables tiktok via COLLECTOR_DISABLED_SOURCES.
  collector_tiktok:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_tiktok
    command: python -m src.main worker --source tiktok
    mem_limit: 1300m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      # Subprocess download tiers enabled ONLY in this isolated container.
      TIKTOK_YTDLP_FALLBACK_ENABLED: "true"
      TIKTOK_GALLERY_DL_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # P3-1 FULL SPLIT: every source runs in its OWN process/container.
  # Same image (unifiedcollector-collector:latest), command
  #   python -m src.main worker --source <name>
  # Shared volumes/env; restart:unless-stopped + per-container mem_limit.
  # The main `collector` service disables ALL of these via
  # COLLECTOR_DISABLED_SOURCES so nothing is collected twice.
  # mem_limit values are tuned for a ~7.7GiB host (see total budget note).
  # ───────────────────────────────────────────────────────────────

  collector_search:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_search
    command: python -m src.main worker --source search
    mem_limit: 1300m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      SEARCH_SPIDER_PAGES: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_website:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_website
    command: python -m src.main worker --source website
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      COLLECTOR_DRIVE_PATH: /media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_lemon8:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_lemon8
    command: python -m src.main worker --source lemon8
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      LEMON8_FYP_DETAIL_FETCH: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_telegram:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_telegram
    command: python -m src.main worker --source telegram
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_github:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_github
    command: python -m src.main worker --source github
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_HANG_TIMEOUT_SECONDS: "7200"
      COLLECTOR_DRIVE_PATH: /media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_strava:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_strava
    command: python -m src.main worker --source strava
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      COLLECTOR_HANG_TIMEOUT_SECONDS: '7200'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_beeper:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_beeper
    command: python -m src.main worker --source beeper
    mem_limit: 768m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  collector_whatsapp:
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_whatsapp
    command: python -m src.main worker --source whatsapp
    mem_limit: 768m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../config/sources:/app/config/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # instagram is INTENTIONALLY not given a dedicated running container yet:
  # the host IP is 429-blocked (all accounts, INSTA_PROXY_DISABLED). Running it
  # would only reset the block timer. When the block clears, copy one of the
  # blocks above as `collector_instagram` (container_name
  # unifiedcollector_collector_instagram) with --source instagram +
  # mem_limit: 1g, then `docker compose up -d collector_instagram`. It stays in
  # the main collector's COLLECTOR_DISABLED_SOURCES so nothing runs it meanwhile.

  tor:
    # Tor SOCKS5 proxy sidecar for the search collector (DDG via Tor).
    # Container exposes 9050/tcp on the internal docker network as `tor:9050`.
    image: dperson/torproxy:latest
    container_name: unifiedcollector_tor
    restart: unless-stopped
    # No ports published to host — only reachable within the compose network.
    healthcheck:
      # dperson/torproxy lacks `nc`/`curl`. Probe Tor by checking the SOCKS port via /proc.
      test: ["CMD-SHELL", "test -e /proc/net/tcp && grep -q ':235A ' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_scheduler
    command: python -m src.main scheduler
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  onboard_bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_onboard_bot
    command: python -m src.bots.onboard_bot
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: unifiedcollector_dashboard
    ports:
      - "8700:8700"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      # Localhost-only single-user deployment: skip bearer-token auth so the
      # dashboard works without a login flow. Remove/false for network exposure.
      DASHBOARD_AUTH_DISABLED: "true"
    volumes:
      - z:/unifiedcollector/media:/media
      - ../credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: unifiedcollector_backup
    profiles: ["manual"]   # never auto-starts; run with: docker compose --profile manual up backup
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGDATABASE: unifiedcollector
    volumes:
      - ./backups:/backups
      - z:/unifiedcollector/media/db/wal_archive:/wal_archive
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          pg_dump -Fc > /backups/unifiedcollector_$$(date +%Y%m%d_%H%M%S).dump
          find /backups -name '*.dump' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: unifiedcollector_rabbitmq
    init: true
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wac_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-localdevrabbit123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    # Management UI port (15672) intentionally NOT exposed:
    # blocked on Windows by reserved port range. AMQP (5672) stays internal-only on docker network.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: unifiedcollector_redis
    init: true
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-localdevredis123} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdevredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-bridge-1:
    build:
      context: ../src/bridges/whatsapp
    container_name: unifiedcollector_wa_bridge_1
    init: true
    restart: unless-stopped
    environment:
      SESSION_NAME: session_1
      AUTH_STORAGE_PATH: /app/auth_info/account1
      WHATSAPP_RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      SYNC_FULL_HISTORY: "true"
      LOG_LEVEL: info
    ports:
      - "3011:3001"
    volumes:
      - ../sessions/whatsapp:/app/auth_info
      - z:/unifiedcollector/media:/data/media
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  wa-bridge-2:
    build:
      context: ../src/bridges/whatsapp
    container_name: unifiedcollector_wa_bridge_2
    init: true
    restart: unless-stopped
    environment:
      SESSION_NAME: session_2
      AUTH_STORAGE_PATH: /app/auth_info/account2
      WHATSAPP_RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      SYNC_FULL_HISTORY: "true"
      LOG_LEVEL: info
    ports:
      - "3012:3001"
    volumes:
      - ../sessions/whatsapp:/app/auth_info
      - z:/unifiedcollector/media:/data/media
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  sessions_data:
