name: unifiedcollector

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unifiedcollector_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unifiedcollector
    ports:
      # Configurable host-side port. Default 5433 to avoid colliding with
      # any pre-existing local postgres on 5432 (e.g. another project's
      # docker postgres). Containers inside this compose network connect
      # via host=postgres:5432 — only the host-side mapping changes.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collector}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_collector
    command: python -m src.main worker --all
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      # freeze fix: youtube AND tiktok run blocking subprocess downloaders
      # (yt-dlp / gallery-dl) that wedge on lost SIGCHLD in WSL2/Docker and freeze
      # the SHARED event loop (py-spy confirmed MainThread stuck in _run_subprocess).
      # Both are disabled here and run out-of-process in their own containers (P3-1).
      # The subprocess_downloader hard-timeout is the defense-in-depth backstop.
      # instagram TEMPORARILY disabled 2026-05-31: the host IP is 429-blocked by
      # Instagram (all accounts, INSTA_PROXY_DISABLED=true). Per decision: wait the
      # block out with ZERO requests (fastest IP recovery, no proxy cost). Re-enable
      # by removing 'instagram' here after ~24-48h, then `docker compose up -d collector`.
      COLLECTOR_DISABLED_SOURCES: "youtube,tiktok,instagram"
      # Beeper Desktop Local API runs on the host at 127.0.0.1:23373.
      # The default URL inside .env (host.docker.internal:23373) resolves
      # via the extra_hosts entry below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - media_data:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../whatsapp_session:/app/whatsapp_session
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # P3-1: youtube runs in its OWN process/container, isolated from the main
  # collector's shared event loop. yt-dlp invokes a blocking subprocess that can
  # wedge on lost SIGCHLD in WSL2/Docker (py-spy confirmed); in the shared worker
  # that froze all 11 collectors. Here a wedge only affects youtube, and
  # restart:unless-stopped + the subprocess_downloader hard-timeout recover it.
  # Re-enabled by NOT disabling it here (the main collector still disables it via
  # COLLECTOR_DISABLED_SOURCES=youtube).
  collector_youtube:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_youtube
    command: python -m src.main worker --source youtube
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - media_data:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../whatsapp_session:/app/whatsapp_session
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # P3-1 (extended to tiktok): tiktok runs in its OWN process/container. Its
  # gallery-dl / yt-dlp fallbacks invoke blocking subprocesses that wedge on lost
  # SIGCHLD in WSL2/Docker (py-spy confirmed gallery_dl_download -> _run_subprocess
  # stuck in threading wait at 0% CPU); in the shared worker that froze ALL
  # collectors. Here a wedge only affects tiktok, and restart:unless-stopped + the
  # subprocess_downloader hard-timeout recover it. The subprocess fallbacks are
  # ENABLED here (overriding the .env defaults that keep them off for the shared
  # main collector). The main collector disables tiktok via COLLECTOR_DISABLED_SOURCES.
  collector_tiktok:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: unifiedcollector-collector:latest
    container_name: unifiedcollector_collector_tiktok
    command: python -m src.main worker --source tiktok
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
      # Subprocess download tiers enabled ONLY in this isolated container.
      TIKTOK_YTDLP_FALLBACK_ENABLED: "true"
      TIKTOK_GALLERY_DL_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    volumes:
      - media_data:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
      - ../whatsapp_session:/app/whatsapp_session
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  tor:
    # Tor SOCKS5 proxy sidecar for the search collector (DDG via Tor).
    # Container exposes 9050/tcp on the internal docker network as `tor:9050`.
    image: dperson/torproxy:latest
    container_name: unifiedcollector_tor
    restart: unless-stopped
    # No ports published to host — only reachable within the compose network.
    healthcheck:
      # dperson/torproxy lacks `nc`/`curl`. Probe Tor by checking the SOCKS port via /proc.
      test: ["CMD-SHELL", "test -e /proc/net/tcp && grep -q ':235A ' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_scheduler
    command: python -m src.main scheduler
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    volumes:
      - media_data:/media
      - ../credentials:/app/credentials
      - sessions_data:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-m", "src.core.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  onboard_bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: unifiedcollector_onboard_bot
    command: python -m src.bots.onboard_bot
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: unifiedcollector_dashboard
    ports:
      - "8700:8700"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/unifiedcollector
      COLLECTOR_DRIVE_PATH: /media
    volumes:
      - media_data:/media
      - ../credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: unifiedcollector_backup
    profiles: ["manual"]   # never auto-starts; run with: docker compose --profile manual up backup
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGDATABASE: unifiedcollector
    volumes:
      - ./backups:/backups
      - c:/unifiedcollector/media/db/wal_archive:/wal_archive
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          pg_dump -Fc > /backups/unifiedcollector_$$(date +%Y%m%d_%H%M%S).dump
          find /backups -name '*.dump' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: unifiedcollector_rabbitmq
    init: true
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wac_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-localdevrabbit123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    # Management UI port (15672) intentionally NOT exposed:
    # blocked on Windows by reserved port range. AMQP (5672) stays internal-only on docker network.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: unifiedcollector_redis
    init: true
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-localdevredis123} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdevredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-bridge-1:
    build:
      context: ../whatsappcollector/services/wa-client-ts
    container_name: unifiedcollector_wa_bridge_1
    init: true
    restart: unless-stopped
    environment:
      SESSION_NAME: session_1
      AUTH_STORAGE_PATH: /app/auth_info/account1
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdevredis123}@redis:6379/0
      MEDIA_BRIDGE_SECRET: ${WHATSAPP_MEDIA_BRIDGE_SECRET}
      MEDIA_STORAGE_PATH: /data/media
      FINDINGS_HUB_GROUP_JID: ${WHATSAPP_FINDINGS_HUB_GROUP_JID:-}
      LOG_LEVEL: info
    ports:
      - "3011:3001"
    volumes:
      - ../whatsappcollector/services/wa-client-ts/auth_info:/app/auth_info
      - media_data:/data/media
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  wa-bridge-2:
    build:
      context: ../whatsappcollector/services/wa-client-ts
    container_name: unifiedcollector_wa_bridge_2
    init: true
    restart: unless-stopped
    environment:
      SESSION_NAME: session_2
      AUTH_STORAGE_PATH: /app/auth_info/account2
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wac_user}:${RABBITMQ_PASSWORD:-localdevrabbit123}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdevredis123}@redis:6379/0
      MEDIA_BRIDGE_SECRET: ${WHATSAPP_MEDIA_BRIDGE_SECRET}
      MEDIA_STORAGE_PATH: /data/media
      FINDINGS_HUB_GROUP_JID: ${WHATSAPP_FINDINGS_HUB_GROUP_JID:-}
      LOG_LEVEL: info
    ports:
      - "3012:3001"
    volumes:
      - ../whatsappcollector/services/wa-client-ts/auth_info:/app/auth_info
      - media_data:/data/media
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  media_data:
  sessions_data:
