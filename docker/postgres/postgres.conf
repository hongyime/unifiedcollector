listen_addresses = '*'
# Raised 50 -> 200: ~14 collector/dashboard/worker pools share this server.
# At max_size=10 per pool (see src/db/connection.py) the worst-case demand is
# ~140 connections; 200 leaves headroom for replication + admin. Idle backends
# are cheap (~2MB each); shared_buffers is unaffected (it's shared, not per-conn).
max_connections = 200

# WAL — continuous archiving for crash recovery
wal_level = replica
max_wal_senders = 3
archive_mode = on
archive_command = 'cp %p /backups/wal/%f'
archive_timeout = 300

# Checkpointing
checkpoint_timeout = 5min
wal_buffers = 64MB

# Memory — conservative for laptop
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Durability — immediate consistency
synchronous_commit = on
wal_sync_method = fdatasync
fsync = on
full_page_writes = on

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_min_duration_statement = 1000
log_checkpoints = on

# Autovacuum
autovacuum = on
autovacuum_naptime = 60
