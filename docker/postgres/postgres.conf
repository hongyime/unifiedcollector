listen_addresses = '*'
# Raised 50 -> 200: ~14 collector/dashboard/worker pools share this server.
# At max_size=10 per pool (see src/db/connection.py) the worst-case demand is
# ~140 connections; 200 leaves headroom for replication + admin. Idle backends
# are cheap (~2MB each); shared_buffers is unaffected (it's shared, not per-conn).
max_connections = 200

# WAL archiving DISABLED (2026-06-21). It was misconfigured (archive_command
# pointed at a non-existent /backups/wal dir), so every archive failed and
# postgres could not recycle WAL -> pg_wal ballooned to 173 GB / 11k segments,
# the real cause of the recurring C: bloat. We back up via scheduled pg_dump to Z
# instead (the `backup` service) — a complete, restorable, bounded snapshot.
# Re-enable ONLY with a working archive_command + base backups + retention.
wal_level = replica
max_wal_senders = 3
archive_mode = off
# archive_command unused when archive_mode=off (auto.conf may still hold /bin/true)

# Checkpointing
checkpoint_timeout = 5min
wal_buffers = 64MB

# Memory — tuned for 4GB container cap (2026-09-19)
# shared_buffers = 25% of mem_limit; effective_cache_size = 50% (OS page cache).
# work_mem raised from 4MB so complex sorts/joins don't spill to disk.
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 128MB

# Durability — immediate consistency
synchronous_commit = on
wal_sync_method = fdatasync
fsync = on
full_page_writes = on

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_min_duration_statement = 1000
log_checkpoints = on

# Autovacuum
autovacuum = on
autovacuum_naptime = 60
