<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UnifiedCollector — Social Tabs</title>
    <style>
      :root {
        --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2a2f3e;
        --fg: #e6e8ee; --muted: #8b91a3; --accent: #6366f1;
        --ok: #34d399; --warn: #fbbf24; --err: #f87171;
      }
      * { box-sizing: border-box; }
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
      header {
        display: flex; align-items: center; gap: 10px; padding: 16px 22px;
        background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff;
      }
      header img { width: 28px; height: 28px; }
      header h1 { font-size: 16px; margin: 0; }
      header .sub { font-size: 11px; opacity: .85; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 20px 22px; }
      .bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
      .bar .spacer { flex: 1; }
      button {
        padding: 8px 14px; cursor: pointer; border: 1px solid var(--border);
        border-radius: 7px; background: var(--panel2); color: var(--fg); font: inherit; font-weight: 600;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:hover { filter: brightness(1.12); }
      .card {
        display: flex; align-items: center; gap: 14px; padding: 14px 16px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
      }
      .card .name { font-weight: 700; font-size: 15px; }
      .card .host { color: var(--muted); font-size: 11px; }
      .badges { display: flex; gap: 14px; margin-left: auto; align-items: center; }
      .badge { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); } .dot.warn { background: var(--warn); }
      .pill { font-size: 10px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
      .pill.active { color: var(--ok); border-color: var(--ok); }
      .toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
      .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
      .note { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.6; }
      .open { padding: 7px 14px; }
      .diag {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 14px; margin-bottom: 16px; color: var(--muted); font-size: 12px;
      }
      .diag strong { color: var(--fg); }
      .diag .bad { color: var(--err); }
      .diag .ok { color: var(--ok); }
      .diag .warn { color: var(--warn); }
      .diag pre {
        margin: 8px 0 0; max-height: 140px; overflow: auto; white-space: pre-wrap;
        color: var(--muted); font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <div>
        <h1>Social Tabs</h1>
        <div class="sub">open + log in once; the bridge scrapes from these tabs</div>
      </div>
    </header>
    <div class="wrap">
      <div class="bar">
        <button id="openAll" class="primary">Open all tabs</button>
        <button id="refreshTabs">Refresh scraper tabs</button>
        <button id="refresh">Refresh status</button>
        <button id="reloadExtension">Reload extension</button>
        <button id="testIngest">Test ingest</button>
        <label class="toggle"><input id="expandedTabs" type="checkbox" /> Expanded tabs</label>
        <div class="spacer"></div>
        <button id="scrape">Scrape now</button>
      </div>
      <div class="diag" id="diag">Checking extension worker...</div>
      <div id="list"></div>
      <p class="note" id="note"></p>
    </div>
    <script src="platforms.js"></script>
    <script src="tabs.js"></script>
  </body>
</html>
