## Provider configuration
providers:
  gallerydl:
    enabled: true

    # Core behavior
    retries: 1
    sleep: 1
    timeout_seconds: 300  # 5 minutes — enough for large accounts with 50+ videos

    # Browser automation fallback (for anti-bot protection)
    # When gallery-dl fails due to TikTok's anti-bot protection, automatically
    # fall back to browser automation (Playwright). Slower but ~95% success rate.
    browser_fallback_enabled: true
    browser_fallback_headless: false  # set to false to show browser window for debugging
    browser_fallback_timeout: 180  # seconds (increased for debugging)

    # yt-dlp fallback (for 403 / TLS fingerprint failures)
    # Sits between gallery-dl and Playwright — faster than Playwright, handles TLS impersonation
    ytdlp_fallback_enabled: true
    ytdlp_fallback_timeout: 120  # seconds

    # Auth (cookies)
    cookies_file: "configs/tiktok_cookies.txt"
    cookies_browser: null

    # Duplicate prevention tracker
    skip_existing: true
    tracker_required: true
    tracker_db: "data/tiktok_toolkit.db"
    tracker_json_backup: "configs/download_tracker.json.backup"

    # Headers
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

    # Proxy
    proxy: null

# Spider configuration
spider:
  # Skip fetching following list if account has more than this many following OR followers.
  # Counts are always stored. Env overrides: TIKTOK_SPIDER_MAX_FOLLOWING, TIKTOK_SPIDER_MAX_FOLLOWERS
  max_following: 500
  max_followers: 500
