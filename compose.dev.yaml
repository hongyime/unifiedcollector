# Standalone development; worker and account integrations require explicit profiles.
name: unifiedcollector-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    init: true
    environment:
      POSTGRES_DB: unifiedcollector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: development
    volumes:
    - dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d unifiedcollector"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
  db-init:
    image: unifiedcollector-app-dev:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    init: true
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://collector:development@postgres:5432/unifiedcollector
      POSTGRES_SSL_MODE: disable
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
    - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - python
    - -c
    - |
      import asyncio
      from src.db.connection import get_pool, close_pool
      from src.db.migrate import apply_all
      async def initialize():
          pool = await get_pool()
          try:
              result = await apply_all(pool)
              if result.get('deferred') or not result.get('schemas'):
                  raise RuntimeError('Development schema initialization did not complete')
          finally:
              await close_pool()
      asyncio.run(initialize())
  redis:
    image: redis:7-alpine
    volumes:
    - dev-redis:/data
  rabbitmq:
    image: rabbitmq:3.13-alpine
    volumes:
    - dev-rabbitmq:/var/lib/rabbitmq
  collector:
    image: unifiedcollector-app-dev:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    init: true
    env_file:
    - path: .env.dev
      required: false
    environment:
      DATABASE_URL: postgresql://collector:development@postgres:5432/unifiedcollector
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      WATCHFILES_FORCE_POLLING: 'true'
      WATCHFILES_POLL_DELAY_MS: '500'
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
    - ./src:/app/src:ro
    - ./config:/app/config:ro
    - dev-data:/app/data
    - dev-sessions:/app/sessions
    depends_on:
    - postgres
    - redis
    - rabbitmq
    command:
    - watchfiles
    - --target-type
    - command
    - python -m src.main worker --all
    - /app/src
    - /app/config
    profiles:
    - workers
  collector_spiderfoot:
    image: unifiedcollector-spiderfoot-dev:local
