version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:00"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:10"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-runtime:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:20"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      dashboard-frontend:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/src/bridges/whatsapp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:30"
    labels:
      - "dependencies"
      - "whatsapp-bridge"
    groups:
      whatsapp-bridge:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:40"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/src/bridges/whatsapp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:50"
    labels:
      - "dependencies"
      - "docker"
      - "whatsapp-bridge"
    open-pull-requests-limit: 5
