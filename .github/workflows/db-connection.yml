name: Database Connection Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - src/db/connection.py
      - tests/core/test_db_connection*.py
      - .github/workflows/db-connection.yml
  push:
    branches: [main]
    paths:
      - src/db/connection.py
      - tests/core/test_db_connection*.py
      - .github/workflows/db-connection.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-db-connection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connection:
    name: Connection recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install asyncpg==0.31.0 pytest==9.0.3 pytest-asyncio==1.4.0 pytest-timeout==2.4.0 pytest-socket==0.7.0
      - run: python -m pytest -p pytest_asyncio.plugin -p pytest_timeout -p pytest_socket --allow-hosts=127.0.0.1,::1 --timeout=10 tests/core/test_db_connection.py tests/core/test_db_connection_budget.py -rA
