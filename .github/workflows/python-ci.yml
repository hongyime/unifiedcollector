name: Python CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "requirements.lock"
      - "pyproject.toml"
      - "src/db/schemas/**"
      - "src/db/migrations/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: collector-python-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock pytest==9.0.3 pytest-asyncio==1.4.0 pytest-timeout==2.4.0 pytest-socket==0.7.0
      - run: python -m pytest -p pytest_asyncio.plugin -p pytest_timeout -p pytest_socket --allow-hosts=127.0.0.1,::1 --timeout=30 tests/ -q --ignore=tests/verify_clean_boot.py --ignore=tests/verify_production.py

  schema-boot:
    name: Clean Volume Boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: cleanboot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install asyncpg
      - run: python tests/verify_clean_boot.py postgresql://testuser:testpass@localhost:5432/cleanboot_test
