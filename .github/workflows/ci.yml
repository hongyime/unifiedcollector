name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff (real-breakage rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.10
      # Gate ONLY on rules that catch genuine defects (syntax errors, undefined
      # names). Style/unused-import cleanup (F401 etc.) is tracked separately and
      # intentionally not blocking yet — see pyproject.toml [tool.ruff.lint].
      - name: ruff E9 + F821 (must pass)
        run: ruff check src/ tests/ --select E9,F821
      # Full ruff report is informational (does not fail the build).
      - name: ruff full report (informational)
        run: ruff check src/ tests/ || true

  test:
    name: pytest + clean-boot schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: collector
          POSTGRES_DB: unifiedcollector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      DATABASE_URL: postgresql://collector:collector@localhost:5432/unifiedcollector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # P0-3 regression guard: a clean (empty) database must produce the full
      # schema via the migration runner alone. This is the test that would have
      # caught the 19-orphaned-tables drift bug.
      - name: Clean-boot schema reproducibility (P0-3)
        run: |
          python tests/verify_clean_boot.py \
            postgresql://collector:collector@localhost:5432/unifiedcollector

      - name: pytest
        run: pytest tests/ -q
