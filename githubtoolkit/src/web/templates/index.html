<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Social Graph - Toolkit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🕸️ GitHub Social Graph</h1>
            <div class="stats" id="stats">
                <span id="stat-users">Nodes: 0</span>
                <span id="stat-edges">Edges: 0</span>
                <span id="stat-selected">Selected: None</span>
                <span id="graph-total" style="font-size:0.8em;opacity:0.7;"></span>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <h2>Filters</h2>
                <div class="filter-group">
                    <label>Followers (min)</label>
                    <input type="number" id="filter-followers-min" value="0" min="0">
                </div>
                <div class="filter-group">
                    <label>Search username/name</label>
                    <input type="text" id="filter-search" placeholder="Enter username...">
                </div>

                <h2>Edge Types</h2>
                <div class="filter-group">
                    <label><input type="checkbox" class="edge-toggle" value="follows" checked> <span style="color:#0f3460">■</span> Follows</label>
                </div>
                <div class="filter-group">
                    <label><input type="checkbox" class="edge-toggle" value="co_contributor" checked> <span style="color:#e9a100">■</span> Co-contributor</label>
                </div>
                <div class="filter-group">
                    <label><input type="checkbox" class="edge-toggle" value="forked" checked> <span style="color:#00b894">■</span> Forked</label>
                </div>
                <div class="filter-group">
                    <label><input type="checkbox" class="edge-toggle" value="starred" checked> <span style="color:#a29bfe">■</span> Starred</label>
                </div>

                <button id="btn-apply-filters" class="btn-primary">Apply Filters</button>
                <button id="btn-reset-filters" class="btn-secondary">Reset</button>
                <button id="btn-load-more" class="btn-secondary" style="display:none;">Load More Nodes</button>

                <hr>

                <h2>Actions</h2>
                <button id="btn-refresh" class="btn-primary">Refresh Graph</button>
                <button id="btn-fit" class="btn-secondary">Fit to Screen</button>

                <hr>

                <div id="user-details" class="user-details" style="display: none;">
                    <h2>User Details</h2>
                    <div id="user-info"></div>
                    <button id="btn-open-github" class="btn-primary">Open on GitHub</button>
                    <button id="btn-follow" class="btn-secondary">Follow User</button>
                </div>
            </aside>

            <main class="graph-container">
                <div id="cy"></div>
                <div id="loading" class="loading">Loading graph...</div>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='graph.js') }}"></script>
</body>
</html>
