# Pre-commit hooks for telegramtoolkit
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Dead code detection with Vulture
  - repo: local
    hooks:
      - id: dead-code-detection
        name: 🦉 Check for dead code (vulture)
        entry: python scripts/detect_dead_code.py
        language: system
        files: ^toolkit/.*\.py$|^main\.py$
        pass_filenames: false
        description: 'Detect unused code using Vulture (min confidence: 70%)'
        minimum_pre_commit_version: 3.6.0
  
  # Python style checks with flake8 (if installed)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: 🧹 Lint with flake8
        files: ^(toolkit/|main\.py|tests/).*\.py$
        exclude: ^(tests/|toolkit/server/api_server\.py)
        args: ['--max-line-length=120', '--ignore=E501,W503']
  
  # Check for large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        name: 📏 Check for large files
        args: ['--maxkb=500']
        description: 'Prevent files larger than 500KB from being committed'
  
  # Check for merge conflict markers
      - id: check-merge-conflict
        name: ⚔️ Check for merge conflicts
        description: 'Check for unresolved merge conflicts'
  
  # Check trailing whitespace
      - id: trailing-whitespace
        name: ✂️ Trim trailing whitespace
        description: 'Remove trailing whitespace'
  
  # Check end of files
      - id: end-of-file-fixer
        name: 📄 Fix end of files
        description: 'Ensure files end with a newline'
  
  # Check Python debug statements
      - id: debug-statements
        name: 🐛 Check for debug statements
        description: 'Prevent committing code with debug statements (pdb, breakpoint, ipdb)'
        files: .*\.py$
  
  # Check YAML syntax
      - id: check-yaml
        name: 📋 Check YAML syntax
        files: \.(yaml|yml)$
  
  # Check JSON syntax
      - id: check-json
        name: { } Check JSON syntax
        files: \.json$

# Configuration for CI/CD integration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
