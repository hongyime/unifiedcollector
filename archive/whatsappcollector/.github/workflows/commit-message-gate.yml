name: commit-message-gate

'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  conventional-commit-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit subjects
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PATTERN='^(feat|fix|docs|refactor|test|chore|perf|style)(\([a-z0-9._/-]+\))?!?: .+'

          mapfile -t SUBJECTS < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")
          if [ "${#SUBJECTS[@]}" -eq 0 ]; then
            echo "No commits found in PR range; skipping commit-subject validation."
            exit 0
          fi

          INVALID=0
          for SUBJECT in "${SUBJECTS[@]}"; do
            if [[ "$SUBJECT" =~ ^Merge\  ]]; then
              continue
            fi

            if [[ ! "$SUBJECT" =~ $PATTERN ]]; then
              echo "::error::Invalid commit subject: '$SUBJECT'"
              INVALID=1
            fi
          done

          if [ "$INVALID" -ne 0 ]; then
            echo "Expected Conventional Commit format: type(scope): description"
            exit 1
          fi

      - name: Validate pull request title
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"
          PATTERN='^(feat|fix|docs|refactor|test|chore|perf|style)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title must follow Conventional Commit format. Got: '$TITLE'"
            exit 1
          fi
