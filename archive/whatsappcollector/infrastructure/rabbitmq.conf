# rabbitmq.conf

# Tell Erlang VM we have 512MB total (matches Docker container limit)
total_memory_available_override_value = 512MiB

# Set the memory high watermark to 60% of 512MB (~307MB)
# This leaves ~200MB headroom before Docker kills the container
vm_memory_high_watermark.relative = 0.6

# Set the disk free limit
disk_free_limit.absolute = 500MB

# Enable heartbeats so the server detects dead clients faster (seconds)
heartbeat = 60

# Reduce default log noise
log.console.level = info
