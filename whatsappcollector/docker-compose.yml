name: whatsappcollector

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_db
    init: true
    restart: unless-stopped
    env_file: .env
    command: >-
      sh -c '
      set -e;
      TLS_DIR=/tmp/postgres_tls;
      CERT_FILE="$${TLS_DIR}/server.crt";
      KEY_FILE="$${TLS_DIR}/server.key";
      mkdir -p "$${TLS_DIR}";
      if [ ! -f "$${CERT_FILE}" ] || [ ! -f "$${KEY_FILE}" ]; then
        openssl req -new -x509 -nodes -days $${POSTGRES_SSL_CERT_DAYS:-3650} \
          -subj "/CN=postgres" \
          -keyout "$${KEY_FILE}" \
          -out "$${CERT_FILE}";
      fi;
      chown postgres:postgres "$${CERT_FILE}" "$${KEY_FILE}";
      chmod 600 "$${KEY_FILE}";
      chmod 644 "$${CERT_FILE}";
      exec docker-entrypoint.sh postgres \
        -c ssl=on \
        -c ssl_cert_file="$${CERT_FILE}" \
        -c ssl_key_file="$${KEY_FILE}"'
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "PGSSLMODE=require pg_isready -U ${POSTGRES_USER:-wac_user} -d ${POSTGRES_DB:-whatsappcollector}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_redis
    init: true
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes --appendfsync everysec
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_rabbitmq
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
    volumes:
      - ./infrastructure/rabbitmq.conf:/etc/rabbitmq/conf.d/custom.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  wa-client-ts-1:
    build:
      context: ./services/wa-client-ts
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_client-ts-1
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      - SESSION_NAME=session_1
    ports:
      - "${WA_CLIENT_1_HOST_PORT:-3011}:3001"
    volumes:
      - auth_info_1:/app/auth_info
      - "${EXTERNAL_STORAGE_ROOT:-media_storage}:/data/media"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  wa-client-ts-2:
    build:
      context: ./services/wa-client-ts
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_client-ts-2
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      - SESSION_NAME=session_2
    ports:
      - "${WA_CLIENT_2_HOST_PORT:-3012}:3001"
    volumes:
      - auth_info_2:/app/auth_info
      - "${EXTERNAL_STORAGE_ROOT:-media_storage}:/data/media"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net


  collector:
    build:
      context: .
      dockerfile: ./services/collector/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_collector
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${COLLECTOR_METRICS_PORT:-9090}:9090"
    volumes:
      - "${EXTERNAL_STORAGE_ROOT:-media_storage}:/data/media"
      - ./shared:/app/shared
      - ./tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wa-client-ts-1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  media_archival:
    build:
      context: .
      dockerfile: ./services/media_archival/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_media_archival
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MEDIA_ARCHIVAL_METRICS_PORT:-9091}:9091"
    volumes:
      - "${EXTERNAL_STORAGE_ROOT:-media_storage}:/data/media"
      - ./shared:/app/shared
      - ./tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_started
      wa-client-ts-1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9091/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  model_downloader:
    image: alpine:3.19
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_model_downloader
    volumes:
      - dlib_models:/data/models
      - ./services/face_recognition/scripts:/scripts:ro
    command: sh /scripts/download_models.sh
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  face_recognition:
    build:
      context: .
      dockerfile: ./services/face_recognition/Dockerfile
    command: ["python", "main.py"]
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_face_recognition
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FACE_RECOGNITION_METRICS_PORT:-9092}:9092"
    volumes:
      - "${EXTERNAL_STORAGE_ROOT:-media_storage}:/data/media"
      - dlib_models:/data/models
      - ./shared:/app/shared
      - ./tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      media_archival:
        condition: service_started
      collector:
        condition: service_started
      wa-client-ts-1:
        condition: service_healthy
      model_downloader:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9092/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  user_intelligence:
    build:
      context: .
      dockerfile: ./services/user_intelligence/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_user_intelligence
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${USER_INTELLIGENCE_METRICS_PORT:-9093}:9093"
    volumes:
      - ./shared:/app/shared
      - ./tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9093/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  link_discovery:
    build:
      context: .
      dockerfile: ./services/link_discovery/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_link_discovery
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${LINK_DISCOVERY_METRICS_PORT:-9094}:9094"
    volumes:
      - ./shared:/app/shared
      - ./tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9094/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  bulk_sender:
    build:
      context: .
      dockerfile: ./services/bulk_sender/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_bulk_sender
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BULK_SENDER_METRICS_PORT:-9095}:9095"
    volumes:
      - "${EXTERNAL_STORAGE_ROOT:-media_storage}:/data/media"
      - ./shared:/app/shared
      - ./tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_started
      media_archival:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9095/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

  dashboard:
    build:
      context: .
      dockerfile: ./services/dashboard/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_dashboard
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DASHBOARD_PORT:-8700}:8700"
    volumes:
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/api/ping')" ]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wac-net

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_postgres
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_redis_data
  rabbitmq_data:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_rabbitmq_data
  auth_info_1:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_auth_info_1
  auth_info_2:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_auth_info_2
  media_storage:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_media_storage
  dlib_models:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_dlib_models

networks:
  wac-net:
    name: ${COMPOSE_PROJECT_NAME:-whatsappcollector}_wac-net
