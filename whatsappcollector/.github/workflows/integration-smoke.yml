name: integration-smoke

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "infrastructure/**"
      - "services/**"
      - "tests/py_tests/test_integration_harness.py"
      - "tests/py_tests/test_biometric_benchmark_gate.py"
      - "tests/py_tests/test_infrastructure_scripts.py"
      - "tests/load_test.py"
      - ".github/workflows/integration-smoke.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare .env for CI integration run
        shell: bash
        run: |
          cp .env.template .env
          python - <<'PY'
          import os
          import secrets

          env_path = '.env'
          with open(env_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          def rand_hex(n=24):
              return secrets.token_hex(n)

          replacements = {
              'POSTGRES_PASSWORD': rand_hex(24),
              'REDIS_PASSWORD': rand_hex(24),
              'RABBITMQ_PASSWORD': rand_hex(24),
              'RABBITMQ_ERLANG_COOKIE': rand_hex(32),
              'MEDIA_BRIDGE_SECRET': rand_hex(32),
              'BROKER_TYPE': 'rabbitmq',
          }

          out = []
          for line in lines:
              stripped = line.strip()
              replaced = False
              for key, value in replacements.items():
                  if stripped.startswith(f'{key}='):
                      out.append(f'{key}={value}\n')
                      replaced = True
                      break
              if not replaced:
                  out.append(line)

          with open(env_path, 'w', encoding='utf-8', newline='\n') as f:
              f.writelines(out)
          PY

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest aio-pika asyncpg

      - name: Run biometric benchmark gate
        run: pytest tests/py_tests/test_biometric_benchmark_gate.py -q

      - name: Run infrastructure script regression tests
        run: pytest tests/py_tests/test_infrastructure_scripts.py -q

      - name: Start integration stack
        run: docker compose up -d postgres redis rabbitmq wa-client-ts-1

      - name: Run bounded load smoke gate
        shell: bash
        run: |
          RABBIT_USER="$(grep -E '^RABBITMQ_USER=' .env | cut -d'=' -f2-)"
          RABBIT_PASS="$(grep -E '^RABBITMQ_PASSWORD=' .env | cut -d'=' -f2-)"
          export RABBITMQ_URL="amqp://${RABBIT_USER}:${RABBIT_PASS}@localhost:5672/"

          python tests/load_test.py \
            --target-count 300 \
            --batch-size 60 \
            --delay 0.05 \
            --max-total-seconds 60 \
            --min-throughput 10

      - name: Run integration harness
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest tests/py_tests/test_integration_harness.py -q

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200 postgres redis rabbitmq wa-client-ts-1

      - name: Stop integration stack
        if: always()
        run: docker compose stop wa-client-ts-1 rabbitmq redis postgres
