<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Toolkit Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
    <h1>Instagram Toolkit Dashboard</h1>

    <section id="summary">
        <h2>User Summary <span id="stats-badge"></span></h2>
        <table id="summaryTable">
            <thead><tr><th>Username</th><th>Followers</th><th>Following</th><th>Public</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>

    <section id="networkGraphSection">
        <h2>Relationship Network Graph</h2>
        <div id="cy" style="width:100%;height:600px;border:1px solid #ccc;background:#fafafa;"></div>
        <p id="graph-status" style="color:#888;font-size:0.9em;margin-top:4px;"></p>
    </section>

    <script src="dashboard.js"></script>
</body>
</html>
