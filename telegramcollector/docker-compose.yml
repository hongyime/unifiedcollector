name: telegramcollector

services:
  # ============================================================
  # Infrastructure
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: telegramcollector_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-telegramcollector}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    command: >-
      postgres
      -c max_connections=200
      -c tcp_keepalives_idle=30
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=3
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=300000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-telegramcollector}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: telegramcollector_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save "" --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # Collector (Phase 3 + 4)
  # ============================================================
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: telegramcollector_collector
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ACCOUNT_SCHEDULE_ENABLED=${ACCOUNT_SCHEDULE_ENABLED:-false}
      - ACCOUNT_ACTIVE_START=${ACCOUNT_ACTIVE_START:-00:00}
      - ACCOUNT_ACTIVE_END=${ACCOUNT_ACTIVE_END:-24:00}
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/mnt/hdd/media
      - ${SESSIONS_BASE_PATH:-./sessions}/collector:/data/sessions/collector
      - ${SESSIONS_BASE_PATH:-./sessions}/collector:/app/sessions
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # Login Bot (Phase 5)
  # ============================================================
  login_bot:
    build:
      context: .
      dockerfile: services/login_bot/Dockerfile
    container_name: telegramcollector_login_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ${SESSIONS_BASE_PATH:-./sessions}:/data/sessions
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # Face Recognition Service (Phase 6)
  # ============================================================
  face_recognition:
    build:
      context: .
      dockerfile: services/face_recognition/Dockerfile
    container_name: telegramcollector_face_recognition
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DB_NAME:-telegramcollector}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/mnt/hdd/media
      - ${SESSIONS_BASE_PATH:-./sessions}/face_recognition:/data/sessions/face_recognition
      - insightface_models:/root/.insightface
    deploy:
      resources:
        limits:
          memory: 4G

  # ============================================================
  # User Intelligence Service (Phase 7)
  # ============================================================
  user_intelligence:
    build:
      context: .
      dockerfile: services/user_intelligence/Dockerfile
    container_name: telegramcollector_user_intelligence
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DB_NAME:-telegramcollector}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================================
  # Link Discovery Service (Phase 8)
  # ============================================================
  link_discovery:
    build:
      context: .
      dockerfile: services/link_discovery/Dockerfile
    container_name: telegramcollector_link_discovery
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DB_NAME:-telegramcollector}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - ${SESSIONS_BASE_PATH:-./sessions}/link_discovery:/data/sessions/link_discovery
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # Bulk Sender Service (Phase 9)
  # ============================================================
  bulk_sender:
    build:
      context: .
      dockerfile: services/bulk_sender/Dockerfile
    container_name: telegramcollector_bulk_sender
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DB_NAME:-telegramcollector}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/mnt/hdd/media
      - ${SESSIONS_BASE_PATH:-./sessions}/bulk_sender:/data/sessions/bulk_sender
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # Unified Web Dashboard — React + FastAPI
  # ============================================================
  webdashboard:
    build:
      context: .
      dockerfile: services/webdashboard/Dockerfile
    container_name: telegramcollector_webdashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "127.0.0.1:8500:8500"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
    name: telegramcollector_postgres
  redis_data:
    name: telegramcollector_redis
  insightface_models:
    name: telegramcollector_insightface_models
